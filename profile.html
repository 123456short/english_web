<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 铁柱英语</title>
  <link rel="stylesheet" href="css/tokens.css">

<body data-page="profile">
  <main class="profile-main">
    <aside class="sidebar">
      <h2 class="sidebar-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

        <p class="panel-desc" id="panelDesc"></p>
      </div>
      <div class="panel-body">
        <!-- 我的已会 -->
        <div class="panel-section" id="sec-known"></div>
        <!-- 我的收藏 -->
        <div class="panel-section" id="sec-favs"></div>

        <div class="panel-section" id="sec-speed"></div>
        <!-- 我的信息 -->
        <div class="panel-section" id="sec-info"></div>

  <script src="js/words.js"></script>
  <script src="js/store.js"></script>
