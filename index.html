<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词汇总 - 铁柱英语</title>
  <link rel="stylesheet" href="css/tokens.css?v=2">
  <link rel="stylesheet" href="css/base.css?v=2">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="words">
  <main class="main">
    <div class="page-head">
      <h1 class="page-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 21V9"></path></svg>
        单词汇总
      </h1>
      <p class="page-desc">点击卡片中的爱心收藏单词，打勾标记为已会，进度自动保存</p>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索单词或释义…">
      </div>
      <div class="filter-chips" id="filterChips"></div>
    </div>

    <div class="word-grid" id="wordGrid"></div>
  </main>

  <script src="js/words.js"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js?v=2"></script>
  <script src="js/index.js"></script>
</body>
</html>
