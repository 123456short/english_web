<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 铁柱英语</title>
  <link rel="stylesheet" href="css/tokens.css?v=2">
  <link rel="stylesheet" href="css/base.css?v=2">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="login">
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div>
          <div class="auth-title">铁柱英语</div>
          <div class="auth-sub">背单词 · 练打字 · 小复习</div>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
      </div>

      <!-- 登录表单 -->
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="loginUser" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="loginPass" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary auth-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          登 录
        </button>
        <p class="auth-hint">首次使用？<a href="#" class="auth-switch" data-go="register">点此注册账号</a></p>
      </form>

      <!-- 注册表单 -->
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label class="form-label">用户名 <span class="form-required">*</span></label>
          <input type="text" class="form-input" id="regUser" autocomplete="username" placeholder="至少 2 位" required>
        </div>
        <div class="form-group">
          <label class="form-label">邮箱（可选）</label>
          <input type="email" class="form-input" id="regEmail" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">密码 <span class="form-required">*</span></label>
          <input type="password" class="form-input" id="regPass" autocomplete="new-password" placeholder="至少 4 位" required>
        </div>
        <div class="form-group">
          <label class="form-label">确认密码 <span class="form-required">*</span></label>
          <input type="password" class="form-input" id="regPass2" autocomplete="new-password" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary auth-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          创建账号
        </button>
        <p class="auth-hint">已有账号？<a href="#" class="auth-switch" data-go="login">点此登录</a></p>
      </form>

      <div class="auth-foot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        数据仅保存在当前浏览器，隐私安全
      </div>
    </div>
  </main>

  <script src="js/words.js"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js?v=2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
