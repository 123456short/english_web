<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日一读 - 铁柱英语</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="reading">
  <main class="main">
    <div class="page-head">
      <h1 class="page-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        每日一读
      </h1>
      <p class="page-desc">点击文中带虚线的单词查看释义，可一键收藏或标记已会；开启翻译对照精读</p>
    </div>

    <div class="reading-wrap">
      <div class="reading-card">
        <div class="reading-head">
          <div>
            <h2 class="reading-title" id="rTitle"></h2>
            <span class="reading-tag" id="rTag"></span>
          </div>
          <div class="reading-toolbar">
            <button class="btn btn-ghost" id="speakBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
              朗读
            </button>
            <button class="btn btn-ghost" id="transBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              显示翻译
            </button>
          </div>
        </div>
        <div class="reading-body" id="rBody"></div>
        <div class="reading-trans" id="rTrans"></div>
      </div>
    </div>
  </main>

  <script src="js/words.js"></script>
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reading.js"></script>
</body>
</html>
